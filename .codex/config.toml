model_auto_compact_token_limit = 900000

[mcp_servers.github_pat]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "JFTP_GITHUB_MCP_PAT"
enabled_tools = [
    "get_me",
    "create_repository",
    "get_file_contents",
    "list_branches",
    "create_branch",
    "list_commits",
    "get_commit",
    "push_files",
    "list_pull_requests",
    "pull_request_read",
    "create_pull_request",
    "update_pull_request",
    "pull_request_review_write",
    "add_comment_to_pending_review",
    "merge_pull_request",
]
http_headers = { "X-MCP-Tools" = "get_me,create_repository,get_file_contents,list_branches,create_branch,list_commits,get_commit,push_files,list_pull_requests,pull_request_read,create_pull_request,update_pull_request,pull_request_review_write,add_comment_to_pending_review,merge_pull_request" }
